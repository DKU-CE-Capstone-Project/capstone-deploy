# Runs inside the frontend container. Caddy is the public entry point.
#
# proxy_pass 에 호스트명을 리터럴로 쓰면(`proxy_pass http://econmind-api:8000;`)
# nginx 는 기동 시점에 딱 한 번 DNS 를 해석하고 그 IP 를 계속 들고 간다. 그래서
#
#   1) econmind-api 가 아직 없으면 프론트 컨테이너가 아예 뜨지 않는다
#      (nginx: [emerg] host not found in upstream "econmind-api")
#   2) econmind-api 를 다시 만들면 IP 가 바뀌는데 nginx 는 죽은 IP 로 계속
#      프록시해서 502 가 난다 — README 의
#      `up -d --no-deps --force-recreate frontend` 가 이걸 우회하던 절차다
#
# $econmind_backend 변수를 거치면 해석이 요청 시점으로 미뤄지고 resolver 의
# valid=10s 만큼만 캐시되므로, API 컨테이너를 재생성해도 프론트는 건드릴 필요가 없다.
#
# 변수와 resolver 는 프론트 이미지(capstone-frontend)의
# docker-entrypoint.d/10-backend-resolver.sh 가 컨테이너 기동 시
# /etc/nginx/conf.d/00-backend.conf 로 만든다. 이 파일은 default.conf 를
# 덮어쓰기만 하므로 00-backend.conf 는 그대로 살아 있다.
# 백엔드 주소를 바꾸려면 frontend 서비스에 BACKEND_ORIGIN 환경변수를 준다.

map $http_x_forwarded_proto $econmind_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 프론트 컨테이너 자체의 생존 확인용.
    # 아래 /health 는 백엔드로 프록시되므로 백엔드가 죽으면 502 가 되어
    # 프론트 헬스체크로는 쓸 수 없다.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Preserve API paths. A trailing URI on proxy_pass would change routing.
    location ~ ^/(api/|analyze(?:/|$)|jobs(?:/|$)|health(?:/|$)) {
        proxy_pass http://$econmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $econmind_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
