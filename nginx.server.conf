# Runs inside the frontend container. Caddy is the public entry point.
map $http_x_forwarded_proto $econmind_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Preserve API paths. A trailing URI on proxy_pass would change routing.
    location ~ ^/(api/|analyze(?:/|$)|jobs(?:/|$)|health(?:/|$)) {
        proxy_pass http://econmind-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $econmind_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
