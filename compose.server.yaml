# Server deployment: docker compose -f compose.server.yaml up -d --build
# Keep this project name to reuse the existing HTTPS, Redis and NATS volumes.
name: econmind

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  # The existing server MongoDB connection (including SSH-tunnel deployments) is preserved.
  MONGODB_URI: ${MONGODB_URI:?Set the server MongoDB URI in deploy/.env}
  MONGODB_DB_NAME: ${MONGODB_DB_NAME:-capstone_news}
  USE_MONGODB: "true"
  MONGODB_REQUIRED: "true"
  NEWS_PROVIDER: naver
  NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:?Set the NCP NAVER API HUB client ID}
  NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:?Set the NCP NAVER API HUB client secret}
  DIFFBOT_TOKEN: ${DIFFBOT_TOKEN:?Set the Diffbot token}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set the Gemini API key}
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_SERVICE_TIER: flex
  GEMINI_TIMEOUT_SECONDS: "600"
  LLM_MAX_OUTPUT_TOKENS: "2048"
  EMBEDDING_TIMEOUT_SECONDS: "30"
  V2_STATE_MEMORY: "false"
  PROTOTYPE_TIER: ${PROTOTYPE_TIER:-FREE}
  V2_MAX_MAPS: ${V2_MAX_MAPS:-10}
  V2_MAX_MAP_NODES: ${V2_MAX_MAP_NODES:-100}
  V2_MAX_MAP_DEPTH: ${V2_MAX_MAP_DEPTH:-5}
  V2_BRANCH_HISTORY_LIMIT: ${V2_BRANCH_HISTORY_LIMIT:-100}
  V2_BODY_TIMEOUT_SECONDS: ${V2_BODY_TIMEOUT_SECONDS:-30}
  V2_BODY_CONCURRENCY: ${V2_BODY_CONCURRENCY:-3}
  V2_BODY_CACHE_SECONDS: ${V2_BODY_CACHE_SECONDS:-3600}
  V2_JOB_TIMEOUT_SECONDS: ${V2_JOB_TIMEOUT_SECONDS:-1800}
  V2_JOB_TTL_SECONDS: ${V2_JOB_TTL_SECONDS:-86400}
  NEWS_MAP_CLIENT_HOURLY_LIMIT: ${NEWS_MAP_CLIENT_HOURLY_LIMIT:-30}
  NEWS_MAP_GLOBAL_HOURLY_LIMIT: ${NEWS_MAP_GLOBAL_HOURLY_LIMIT:-300}
  NEWS_MAP_SELECTOR: ${NEWS_MAP_SELECTOR:-embedding}
  NEWS_MAP_DECISION_TIMEOUT_SECONDS: ${NEWS_MAP_DECISION_TIMEOUT_SECONDS:-30}
  NEWS_MAP_DECISION_TOTAL_TIMEOUT_SECONDS: ${NEWS_MAP_DECISION_TOTAL_TIMEOUT_SECONDS:-90}
  NEWS_MAP_DECISION_CONCURRENCY: ${NEWS_MAP_DECISION_CONCURRENCY:-4}
  NEWS_MAP_DECISION_MAX_CALLS: ${NEWS_MAP_DECISION_MAX_CALLS:-200}
  NEWS_MAP_DECISION_CACHE_TTL_SECONDS: ${NEWS_MAP_DECISION_CACHE_TTL_SECONDS:-3600}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  NEWS_MAP_EMBEDDING_MODEL: ${NEWS_MAP_EMBEDDING_MODEL:-gemini-embedding-001}
  NEWS_MAP_EMBEDDING_DIMENSIONS: ${NEWS_MAP_EMBEDDING_DIMENSIONS:-768}
  NEWS_MAP_EMBEDDING_TASK_TYPE: ${NEWS_MAP_EMBEDDING_TASK_TYPE:-SEMANTIC_SIMILARITY}
  NEWS_MAP_INITIAL_CANDIDATES: ${NEWS_MAP_INITIAL_CANDIDATES:-20}
  NEWS_MAP_MAX_CANDIDATES: ${NEWS_MAP_MAX_CANDIDATES:-50}
  NEWS_MAP_EMBEDDING_CONCURRENCY: ${NEWS_MAP_EMBEDDING_CONCURRENCY:-3}
  NEWS_MAP_MIN_RELEVANCE: ${NEWS_MAP_MIN_RELEVANCE:-0.65}
  NEWS_MAP_KEYWORD_WEIGHT: ${NEWS_MAP_KEYWORD_WEIGHT:-0.10}
  NEWS_MAP_ENTITY_ONLY_PENALTY: ${NEWS_MAP_ENTITY_ONLY_PENALTY:-0.10}
  NEWS_MAP_MMR_LAMBDA: ${NEWS_MAP_MMR_LAMBDA:-0.70}
  NEWS_MAP_REPEAT_COSINE: ${NEWS_MAP_REPEAT_COSINE:-0.92}
  NEWS_MAP_REPEAT_TEXT_SIMILARITY: ${NEWS_MAP_REPEAT_TEXT_SIMILARITY:-0.55}
  NEWS_MAP_REPEAT_TITLE_SIMILARITY: ${NEWS_MAP_REPEAT_TITLE_SIMILARITY:-0.50}
  NEWS_MAP_REPEAT_SHORT_TEXT_SIMILARITY: ${NEWS_MAP_REPEAT_SHORT_TEXT_SIMILARITY:-0.85}
  NEWS_MAP_REPEAT_MAX_HOURS: ${NEWS_MAP_REPEAT_MAX_HOURS:-48}
  NEWS_MAP_REPEAT_DESCRIPTION_MIN_CHARS: ${NEWS_MAP_REPEAT_DESCRIPTION_MIN_CHARS:-40}
  NEWS_MAP_REPEAT_NOVELTY_RATIO: ${NEWS_MAP_REPEAT_NOVELTY_RATIO:-0.25}
  NEWS_MAP_SUPPLEMENT_MAX_SEARCHES: ${NEWS_MAP_SUPPLEMENT_MAX_SEARCHES:-3}
  NEWS_MAP_SUPPLEMENT_PAGE_SIZE: ${NEWS_MAP_SUPPLEMENT_PAGE_SIZE:-20}
  NEWS_MAP_SUPPLEMENT_TIMEOUT_SECONDS: ${NEWS_MAP_SUPPLEMENT_TIMEOUT_SECONDS:-20}
  NEWS_MAP_SUPPLEMENT_CACHE_TTL_SECONDS: ${NEWS_MAP_SUPPLEMENT_CACHE_TTL_SECONDS:-60}
  METADATA_TIMEOUT_SECONDS: "660"
  METADATA_BATCH_TIMEOUT_SECONDS: "660"
  METADATA_CONCURRENCY: "3"
  LLM_PROVIDER: gemini
  ANTHROPIC_API_KEY: ""
  DEMO_MODE: "false"
  USE_MOCK_NEWS: "false"
  USE_LLM_METADATA: "true"
  USE_LLM_SUMMARIES: "false"
  USE_RAG: ${USE_RAG:-true}
  USE_CRITIC: ${USE_CRITIC:-true}
  CORS_ORIGINS: ${APP_ORIGIN:-https://econmind.duckdns.org}
  SESSION_STORE_REQUIRED: "true"
  SESSION_COOKIE_SECURE: "true"
  SESSION_COOKIE_SAMESITE: lax
  # Explicit server opt-in; pair true with PROTOTYPE_TIER=PAID for 10 articles.
  PAID_DEMO_ENABLED: ${PAID_DEMO_ENABLED:-false}
  SESSION_ISSUE_CLIENT_HOURLY_LIMIT: ${SESSION_ISSUE_CLIENT_HOURLY_LIMIT:-30}
  SESSION_ISSUE_GLOBAL_HOURLY_LIMIT: ${SESSION_ISSUE_GLOBAL_HOURLY_LIMIT:-600}
  JOBS_CLIENT_HOURLY_LIMIT: ${JOBS_CLIENT_HOURLY_LIMIT:-20}
  REPORTS_CLIENT_HOURLY_LIMIT: ${REPORTS_CLIENT_HOURLY_LIMIT:-10}
  STRATEGIES_CLIENT_HOURLY_LIMIT: ${STRATEGIES_CLIENT_HOURLY_LIMIT:-20}
  ANALYZE_CLIENT_HOURLY_LIMIT: ${ANALYZE_CLIENT_HOURLY_LIMIT:-20}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ECONMIND_TEAM_USER: ${ECONMIND_TEAM_USER:?Set the team login username}
      ECONMIND_TEAM_PASSWORD_HASH: ${ECONMIND_TEAM_PASSWORD_HASH:?Set the Caddy password hash}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    mem_limit: 128m
    logging: *logging
    networks:
      proxy:
        ipv4_address: 172.30.241.9

  frontend:
    image: econmind-frontend:local
    build:
      context: ../frontend
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    networks:
      proxy:
        ipv4_address: 172.30.241.10
    volumes:
      - ./nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      econmind-api:
        condition: service_healthy
    mem_limit: 128m
    logging: *logging

  econmind-api:
    image: econmind-backend:local
    build: ../backend
    restart: unless-stopped
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=172.30.241.10
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=5)); assert d.get('status')=='ok' and d.get('mongodb')=='on' and d.get('redis')=='on'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 1024m
    logging: *logging
    networks:
      - default
      - proxy

  econmind-worker:
    image: econmind-backend:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      econmind-api:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  econmind-v2-worker:
    image: econmind-backend:local
    pull_policy: never
    restart: unless-stopped
    command: ["python", "-m", "app.v2.report_worker"]
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      econmind-api:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    mem_limit: 256m
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  nats_data:
  redis_data:

networks:
  default: {}
  # Dedicated ingress network; only the frontend's fixed address may supply
  # forwarding headers to Uvicorn. Check for host network conflicts before deploy.
  proxy:
    ipam:
      config:
        - subnet: 172.30.241.0/28
