# KEDA ScaledObject — NATS JetStream 큐 적체(consumer lag) 기준 worker 오토스케일.
# 이 매니페스트가 발표의 핵심: "속보 burst → 큐 적체 → worker 1→N 자동확장".
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analysis-worker-scaler
  namespace: econmind
spec:
  scaleTargetRef:
    name: analysis-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 5      # 5초마다 큐 적체 확인
  cooldownPeriod: 30      # idle 30초 후 축소
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # 기본 5분 안정화 창을 30초로 단축 (데모 그래프가 1→N→1로 깔끔하게 보이도록)
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: nats-jetstream
      metadata:
        # NATS Helm 설치 시 모니터링(8222)은 nats-headless 서비스에 노출됨.
        natsServerMonitoringEndpoint: "nats-headless.default.svc.cluster.local:8222"
        account: "$G"
        stream: "analysis"
        consumer: "analysis-workers"
        lagThreshold: "5"   # consumer당 미처리 5건 초과 시 확장
