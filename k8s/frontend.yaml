# EconMind 프론트엔드 (nginx: 정적 SPA + /api·/jobs·/analyze 백엔드 프록시)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econmind-frontend
  namespace: econmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econmind-frontend
  template:
    metadata:
      labels:
        app: econmind-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/dku-ce-capstone-project/econmind-frontend:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # /healthz 는 nginx 가 직접 200 을 돌려주는 프론트 자체 생존 확인용이다.
          # /health 는 econmind-api 로 프록시되므로 백엔드가 내려가면 502 가 되어
          # 프론트 파드까지 죽는다 — 프로브에 쓰면 안 된다.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: econmind-frontend
  namespace: econmind
spec:
  selector:
    app: econmind-frontend
  ports:
    - port: 80
      targetPort: 80
