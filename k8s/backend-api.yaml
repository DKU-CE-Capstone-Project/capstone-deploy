# EconMind API — 요청 수신 + NATS 발행 + Redis 결과 조회 (replica 1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econmind-api
  namespace: econmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econmind-api
  template:
    metadata:
      labels:
        app: econmind-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dku-ce-capstone-project/econmind-backend:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NATS_URL
              value: "nats://nats.default.svc.cluster.local:4222"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            # API(UI 제품 데모): 실시간 뉴스 + Gemini 리포트
            - name: DEMO_MODE
              value: "false"
            - name: USE_MOCK_NEWS
              value: "false"
            # GDELT가 429/타임아웃인 환경 → NewsAPI 직행 (행 방지)
            - name: USE_GDELT
              value: "false"
            # 무료 Gemini 일일 쿼터 절약: 카드 요약은 description 사용, Gemini는 리포트/전략에만
            - name: USE_LLM_SUMMARIES
              value: "false"
            # gemini-flash-latest(3.5, 20/day)·2.0-flash(0)는 쿼터 막힘 → lite가 무료 쿼터 넉넉
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash-lite"
            - name: CORS_ORIGINS
              value: "*"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: GOOGLE_API_KEY
                  optional: true
            - name: NEWSAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: NEWSAPI_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: econmind-api
  namespace: econmind
spec:
  selector:
    app: econmind-api
  ports:
    - port: 8000
      targetPort: 8000
