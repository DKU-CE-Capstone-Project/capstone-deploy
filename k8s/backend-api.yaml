# EconMind API — 요청 수신 + NATS 발행 + Redis 결과 조회 (replica 1)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econmind-api
  namespace: econmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econmind-api
  template:
    metadata:
      labels:
        app: econmind-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dku-ce-capstone-project/econmind-backend:demo
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NATS_URL
              value: "nats://nats.default.svc.cluster.local:4222"
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            # API(UI 제품 데모): 실시간 뉴스 + Gemini 리포트
            - name: DEMO_MODE
              value: "false"
            - name: USE_MOCK_NEWS
              value: "false"
            # GDELT가 429/타임아웃인 환경 → NewsAPI 직행 (행 방지)
            - name: USE_GDELT
              value: "false"
            # Claude로 전환 후 쿼터 여유 → LLM 요약 활성(뉴스 제목·요약 한국어화)
            - name: USE_LLM_SUMMARIES
              value: "true"
            # gemini-flash-latest(3.5, 20/day)·2.0-flash(0)는 쿼터 막힘 → lite가 무료 쿼터 넉넉
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash-lite"
            # MongoDB Atlas: 영속화 + 벡터검색(RAG). Atlas IP 화이트리스트 필요.
            - name: USE_MONGODB
              value: "true"
            - name: EMBEDDING_MODEL
              value: "gemini-embedding-001"
            - name: USE_RAG
              value: "true"
            - name: USE_CRITIC
              value: "true"
            # LLM 제공자: ANTHROPIC_API_KEY 있으면 Claude 우선(쿼터 여유), 없으면 Gemini.
            - name: CLAUDE_MODEL
              value: "claude-sonnet-4-6"
            - name: CORS_ORIGINS
              value: "*"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: GOOGLE_API_KEY
                  optional: true
            - name: NEWSAPI_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: NEWSAPI_KEY
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: MONGODB_URI
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: ANTHROPIC_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: econmind-api
  namespace: econmind
spec:
  selector:
    app: econmind-api
  ports:
    - port: 8000
      targetPort: 8000
