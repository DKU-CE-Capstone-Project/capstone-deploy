[SERVICE]
    Flush         1
    Grace         5
    Log_Level     warn

[INPUT]
    Name             forward
    Listen           0.0.0.0
    Port             24224
    Mem_Buf_Limit    16M

[FILTER]
    Name    grep
    Match   econmind.usage
    Regex   log "event_type"[[:space:]]*:[[:space:]]*"econmind_usage"

[OUTPUT]
    Name         http
    Match        econmind.usage
    Host         usage-store
    Port         8080
    URI          /ingest
    Format       json
    Retry_Limit  no_limits
