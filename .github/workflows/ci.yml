name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate server Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONGODB_URI: mongodb://ci:ci@127.0.0.1:27017/capstone_news?authSource=admin
      MONGODB_DB_NAME: capstone_news
      NAVER_CLIENT_ID: ci-client-id
      NAVER_CLIENT_SECRET: ci-client-secret
      DIFFBOT_TOKEN: ci-diffbot-token
      GOOGLE_API_KEY: ci-google-key
      APP_ORIGIN: https://example.invalid
      MONGODB_ROOT_USERNAME: ci-root
      MONGODB_ROOT_PASSWORD: ci-root-password
      MONGODB_APP_USERNAME: ci-app
      MONGODB_APP_PASSWORD: ci-app-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: python3 scripts/check-news-map-settings.py

      - name: Validate server security settings
        run: docker compose -f compose.server.yaml config --format json | python3 scripts/check-server-security.py

      - name: Validate explicit PAID demo settings
        run: |
          PROTOTYPE_TIER=PAID PAID_DEMO_ENABLED=true docker compose -f compose.server.yaml config --format json | python3 scripts/check-server-security.py --paid-demo

      - name: Validate Caddy proxy syntax
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

      - name: Validate Nginx proxy syntax and real-IP module
        run: |
          printf 'map $host $econmind_backend { default 127.0.0.1:8000; }\n' > /tmp/econmind-backend-map.conf
          docker run --rm -v "$PWD/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro" -v "/tmp/econmind-backend-map.conf:/etc/nginx/conf.d/00-backend.conf:ro" nginx:alpine nginx -t
